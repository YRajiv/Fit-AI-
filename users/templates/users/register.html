<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FitAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #080612 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            padding: 30px 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #a855f7;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            color: #a1a1aa;
            font-size: 14px;
            margin-top: 5px;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        form p {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        form label {
            font-weight: 600;
            color: #e2e8f0;
        }

        form input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .helptext, ul.helptext {
            font-size: 11px;
            color: #94a3b8;
            list-style-type: none;
            padding-left: 0;
            line-height: 1.4;
        }

        .btn-action {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(168, 85, 247, 0.6);
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #a1a1aa;
        }

        .footer-links a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="logo-area">
            <div class="logo">🏋️ FitAI</div>
            <div class="subtitle">Create an account to start tracking your progress.</div>
        </div>

        {% if form.errors %}
            <div class="error-msg">
                Please correct the errors below and try again.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-action">Sign Up</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="{% url 'users:login' %}">Log in</a>
        </div>
    </div>

</body>
</html>
